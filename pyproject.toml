[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Crash/Boom Quant Lab Dashboard — fundación de migración (RAM-only)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "pydantic>=2",
    "pydantic-settings",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "arch",
    "structlog",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
# legacy/ es referencia inmutable (hash fijado); specs/ y .specify/.swarm/.opencode
# son documentación y tooling: no se lintean ni se formatean.
exclude = ["legacy", "specs", ".specify", ".swarm", ".opencode"]
